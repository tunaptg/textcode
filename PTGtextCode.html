<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chữ màu Play Together</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0e14;
  --surface: #151720;
  --surface2: #1c1f2e;
  --surface3: #232840;
  --border: #2a2f4a;
  --border2: #353b5c;
  --accent: #7b8fff;
  --accent-glow: rgba(123,143,255,0.25);
  --text: #dde1f5;
  --text-muted: #6b719a;
  --text-dim: #4a5070;
  --green: #50fa7b;
  --red: #ff5555;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
  --r: 10px;
  --r-sm: 6px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: clamp(16px,4vw,32px);
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}

/* ── Layout ── */
.app { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: baseline; gap: 12px; }
header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
header p  { font-size: 0.8rem; color: var(--text-muted); }

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: visible;
}
.card-header {
  padding: 9px 14px;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  border-radius: var(--r) var(--r) 0 0;
}

/* ── Toolbar ── */
.toolbar {
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.divider { width: 1px; height: 26px; background: var(--border); margin: 0 2px; }

.btn {
  font-family: var(--sans);
  font-size: 0.78rem;
  font-weight: 500;
  height: 32px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  background: var(--surface2);
  color: var(--text);
  transition: background .12s, border-color .12s, box-shadow .12s, transform .08s;
  display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap;
  position: relative;
}
.btn:hover {
  background: var(--surface3);
  border-color: var(--border2);
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.btn:active { transform: scale(.96); }

.btn-b { font-weight: 800; font-size: 0.9rem; }
.btn-i { font-style: italic; font-size: 0.9rem; }

.btn-color {
  border-color: transparent;
  background: linear-gradient(135deg, var(--surface2), var(--surface3));
  gap: 7px;
}
.btn-color:hover { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.color-preview {
  width: 14px; height: 14px; border-radius: 3px;
  border: 1.5px solid rgba(255,255,255,0.2);
  flex-shrink: 0;
}

.btn-size { border-color: transparent; background: linear-gradient(135deg,var(--surface2),var(--surface3)); }
.btn-size:hover { border-color: #a78bfa; box-shadow: 0 0 0 2px rgba(167,139,250,.2); }

/* ── Editor ── */
.editor-wrap { position: relative; }
textarea {
  width: 100%;
  min-height: 150px;
  background: transparent;
  border: none;
  resize: vertical;
  font-family: var(--mono);
  font-size: 0.84rem;
  line-height: 1.7;
  color: var(--text);
  padding: 14px 16px;
  outline: none;
  display: block;
}
textarea::placeholder { color: var(--text-dim); }

.action-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
  border-radius: 0 0 var(--r) var(--r);
}
.btn-copy {
  font-size: 0.78rem; font-weight: 600;
  height: 30px; padding: 0 16px;
  background: var(--accent);
  border: none; border-radius: var(--r-sm);
  color: #0d0e14; cursor: pointer;
  transition: opacity .15s, box-shadow .15s;
  font-family: var(--sans);
}
.btn-copy:hover { opacity: .88; box-shadow: 0 0 12px var(--accent-glow); }
.btn-clr {
  font-size: 0.78rem; height: 30px; padding: 0 12px;
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer;
  font-family: var(--sans); transition: border-color .12s, color .12s;
}
.btn-clr:hover { border-color: var(--red); color: var(--red); }
.copy-ok {
  font-size: 0.75rem; color: var(--green);
  opacity: 0; transition: opacity .3s; margin-left: 2px;
}
.copy-ok.show { opacity: 1; }
.char-count { margin-left: auto; font-size: 0.72rem; color: var(--text-dim); font-family: var(--mono); }

/* ── Preview ── */
.preview {
  padding: 14px 16px;
  font-size: 0.9rem; line-height: 1.8;
  min-height: 56px; word-break: break-word;
}
.preview-empty { color: var(--text-dim); font-size: 0.82rem; }
.preview i { font-style: italic; }
.preview b { font-weight: 700; }

/* ── Tag ref ── */
.tag-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
.tag-pill {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px;
  font-family: var(--mono); font-size: 0.72rem; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
}
.tag-pill span { color: var(--text-muted); font-family: var(--sans); font-size: 0.7rem; }

/* ─────────────────────────────────────────────────
   COLOR PICKER POPUP
───────────────────────────────────────────────── */
.picker-anchor { position: relative; display: inline-flex; }

.color-popup {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 200;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  width: 260px;
  overflow: hidden;
  animation: popIn .15s cubic-bezier(.34,1.56,.64,1);
}
.color-popup.open { display: block; }
@keyframes popIn {
  from { opacity:0; transform:translateY(-6px) scale(.97); }
  to   { opacity:1; transform:translateY(0)   scale(1); }
}

/* Gradient canvas */
.sv-canvas-wrap {
  position: relative;
  width: 100%; height: 160px;
  cursor: crosshair; flex-shrink: 0;
}
#svCanvas { display: block; width: 100%; height: 100%; }
.sv-cursor {
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  pointer-events: none;
  transform: translate(-50%,-50%);
  top: 10%; left: 90%;
}

.picker-controls { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

/* Hue bar */
.hue-wrap { position: relative; height: 14px; border-radius: 7px; overflow: hidden; cursor: pointer; flex-shrink: 0; }
#hueBar {
  width: 100%; height: 100%; display: block;
  background: linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
}
.hue-thumb {
  position: absolute;
  top: 50%; width: 16px; height: 16px;
  border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
  pointer-events: none;
  transform: translate(-50%,-50%);
  left: 0%;
}

/* Opacity bar */
.alpha-wrap { position: relative; height: 14px; border-radius: 7px; overflow: hidden; cursor: pointer; }
.alpha-checker {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(45deg,#777 25%,transparent 25%),
    linear-gradient(-45deg,#777 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#777 75%),
    linear-gradient(-45deg,transparent 75%,#777 75%);
  background-size: 8px 8px;
  background-position: 0 0, 0 4px, 4px -4px, -4px 0;
  background-color: #aaa;
}
#alphaBar { position: absolute; inset: 0; border-radius: 7px; }
.alpha-thumb {
  position: absolute;
  top: 50%; width: 16px; height: 16px;
  border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
  pointer-events: none;
  transform: translate(-50%,-50%);
  left: 100%;
}

/* Result row */
.result-row { display: flex; gap: 8px; align-items: center; }
.result-swatch {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.12);
  flex-shrink: 0;
  background-image:
    linear-gradient(45deg,#555 25%,transparent 25%),
    linear-gradient(-45deg,#555 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#555 75%),
    linear-gradient(-45deg,transparent 75%,#555 75%);
  background-size: 10px 10px;
  background-position: 0 0,0 5px,5px -5px,-5px 0;
  background-color: #888;
  position: relative;
}
.result-swatch-color { position: absolute; inset: 0; border-radius: 7px; }
.result-inputs { flex: 1; display: flex; gap: 6px; }
.result-inputs input {
  flex: 1; min-width: 0;
  font-family: var(--mono); font-size: 0.72rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text);
  padding: 5px 7px; outline: none;
  transition: border-color .12s;
}
.result-inputs input:focus { border-color: var(--accent); }
.hex-label, .alpha-label {
  font-size: 0.6rem; color: var(--text-dim); text-align: center; margin-top: 2px;
  font-weight: 600; letter-spacing: .05em;
}
.inp-group { display: flex; flex-direction: column; flex: 1; min-width: 0; }

/* Presets */
.preset-row { display: flex; gap: 5px; flex-wrap: wrap; padding: 0 12px 10px; }
.preset-swatch {
  width: 20px; height: 20px; border-radius: 4px;
  cursor: pointer; border: 1.5px solid transparent;
  transition: transform .1s, border-color .1s;
}
.preset-swatch:hover { transform: scale(1.2); border-color: rgba(255,255,255,.5); }

/* Apply button */
.picker-apply {
  margin: 0 12px 12px;
  display: block; width: calc(100% - 24px);
  font-family: var(--sans); font-size: 0.78rem; font-weight: 600;
  height: 32px; border: none; border-radius: var(--r-sm);
  background: var(--accent); color: #0d0e14; cursor: pointer;
  transition: opacity .15s;
}
.picker-apply:hover { opacity: .85; }

/* ── Size popup ── */
.size-popup {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 200;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  box-shadow: 0 16px 48px rgba(0,0,0,.5);
  width: 200px;
  padding: 12px;
  animation: popIn .15s cubic-bezier(.34,1.56,.64,1);
}
.size-popup.open { display: block; }
.size-popup label { font-size: 0.68rem; color: var(--text-dim); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 8px; }
.size-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.size-chip {
  font-family: var(--sans); font-size: 0.72rem;
  padding: 3px 9px; border-radius: 20px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); cursor: pointer;
  transition: background .1s, border-color .1s, color .1s;
}
.size-chip:hover { border-color: #a78bfa; color: #a78bfa; background: rgba(167,139,250,.1); }
.size-custom { display: flex; gap: 6px; }
.size-custom input {
  flex: 1; font-family: var(--mono); font-size: 0.8rem;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text); padding: 5px 8px; outline: none;
}
.size-custom input:focus { border-color: #a78bfa; }
.size-apply {
  font-family: var(--sans); font-size: 0.72rem; font-weight: 600;
  padding: 0 10px; border: none; border-radius: var(--r-sm);
  background: #a78bfa; color: #0d0e14; cursor: pointer;
}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Chữ màu/kiểu chữ cho bảng chữ Play Together </h1>
    <p>by Tuna</p>
  </header>

  <!-- Toolbar -->
  <div class="card">
    <div class="card-header">Chọn định dạng</div>
    <div class="toolbar">

      <!-- Bold / Italic -->
      <button class="btn btn-b" onclick="wrapTag('b')" title="Đậm">B</button>
      <button class="btn btn-i" onclick="wrapTag('i')" title="Nghiêng">I</button>

      <div class="divider"></div>

      <!-- Color picker -->
      <div class="picker-anchor" id="colorAnchor">
        <button class="btn btn-color" onclick="toggleColor()" id="colorBtn">
          <div class="color-preview" id="colorPreview" style="background:#7b8fff"></div>
          Màu ▾
        </button>

        <div class="color-popup" id="colorPopup">
          <!-- SV Canvas -->
          <div class="sv-canvas-wrap" id="svWrap">
            <canvas id="svCanvas" width="260" height="160"></canvas>
            <div class="sv-cursor" id="svCursor"></div>
          </div>

          <div class="picker-controls">
            <!-- Hue -->
            <div class="hue-wrap" id="hueWrap">
              <canvas id="hueBar" width="240" height="14"></canvas>
              <div class="hue-thumb" id="hueThumb"></div>
            </div>

            <!-- Alpha -->
            <div class="alpha-wrap" id="alphaWrap">
              <div class="alpha-checker"></div>
              <canvas id="alphaBar" width="240" height="14"></canvas>
              <div class="alpha-thumb" id="alphaThumb"></div>
            </div>

            <!-- Result -->
            <div class="result-row">
              <div class="result-swatch" id="resultSwatch">
                <div class="result-swatch-color" id="resultSwatchColor"></div>
              </div>
              <div class="result-inputs">
                <div class="inp-group">
                  <input type="text" id="hexInput" maxlength="7" value="#7b8fff">
                  <div class="hex-label">HEX</div>
                </div>
                <div class="inp-group">
                  <input type="number" id="alphaInput" min="0" max="100" value="100">
                  <div class="alpha-label">A%</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Presets -->
          <div class="preset-row" id="presetRow"></div>

          <button class="picker-apply" onclick="applyColor()">Chèn thẻ màu</button>
        </div>
      </div>

      <!-- Size picker -->
      <div class="picker-anchor" id="sizeAnchor">
        <button class="btn btn-size" onclick="toggleSize()">
          Aa Cỡ chữ ▾
        </button>
        <div class="size-popup" id="sizePopup">
          <label>Kích thước</label>
          <div class="size-chips" id="sizeChips"></div>
          <div class="size-custom">
            <input type="number" id="sizeInput" value="16" min="1" max="200" placeholder="px">
            <button class="size-apply" onclick="applySize()">Chèn</button>
          </div>
        </div>
      </div>

      <div class="divider"></div>
      <button class="btn" onclick="insertNewline()">↵ Xuống dòng</button>

    </div>
  </div>

  <!-- Editor -->
  <div class="card">
    <div class="card-header">Nhập và chỉnh sửa văn bản</div>
    <div class="editor-wrap">
      <textarea id="editor" spellcheck="false"
        placeholder="Nhập văn bản hoặc bôi đen rồi nhấn nút để chèn thẻ..."></textarea>
    </div>
    <div class="action-bar">
      <button class="btn-copy" onclick="copyText()">Sao chép</button>
      <button class="btn-clr" onclick="clearText()">Xóa hết</button>
      <span class="copy-ok" id="copyOk">✓ Đã sao chép!</span>
      <span class="char-count" id="charCount">0 ký tự</span>
    </div>
  </div>

  <!-- Preview -->
  <div class="card">
    <div class="card-header">Xem trước</div>
    <div class="preview" id="preview">
      <span class="preview-empty">Văn bản đã định dạng sẽ hiện ở đây…</span>
    </div>
  </div>

  <!-- Tag ref -->
  <div class="card">
    <div class="card-header">Tham khảo thẻ</div>
    <div class="tag-grid">
      <div class="tag-pill"><code>&lt;b&gt;…&lt;/b&gt;</code><span>Đậm</span></div>
      <div class="tag-pill"><code>&lt;i&gt;…&lt;/i&gt;</code><span>Nghiêng</span></div>
      <div class="tag-pill"><code>&lt;color="#hex"&gt;…&lt;/color&gt;</code><span>Màu chữ</span></div>
      <div class="tag-pill"><code>&lt;size="16"&gt;…&lt;/size&gt;</code><span>Cỡ chữ</span></div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════
   HSV COLOR PICKER
═══════════════════════════════════════════════ */
const PRESETS = [
  '#ff4d4d','#ff8c42','#ffd700','#a8ff3e','#4ade80','#22d3ee',
  '#7b8fff','#a78bfa','#f472b6','#ff6b9d','#fff','#aaa','#555','#000'
];

let hsv = { h:231, s:51, v:100 };
let alpha = 100;

const svCanvas    = document.getElementById('svCanvas');
const svCtx       = svCanvas.getContext('2d');
const svCursor    = document.getElementById('svCursor');
const hueBar      = document.getElementById('hueBar');
const hueThumb    = document.getElementById('hueThumb');
const alphaCanvas = document.getElementById('alphaBar');
const alphaCtx    = alphaCanvas.getContext('2d');
const alphaThumb  = document.getElementById('alphaThumb');
const hexInput    = document.getElementById('hexInput');
const alphaInput  = document.getElementById('alphaInput');
const colorPreview= document.getElementById('colorPreview');
const resultSwatchColor = document.getElementById('resultSwatchColor');

function hsvToRgb(h,s,v){
  s/=100; v/=100;
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}
  else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}
  else if(h<300){r=x;b=c;}else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}

function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(n=>n.toString(16).padStart(2,'0')).join('');
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function rgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0;
  if(d){
    if(max===r) h=((g-b)/d+6)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60;
  }
  return {h:Math.round(h), s:max?Math.round(d/max*100):0, v:Math.round(max*100)};
}

function drawSV(){
  const w=svCanvas.width, h=svCanvas.height;
  // white → hue gradient (left→right)
  const gH = svCtx.createLinearGradient(0,0,w,0);
  gH.addColorStop(0,'#fff');
  gH.addColorStop(1,`hsl(${hsv.h},100%,50%)`);
  svCtx.fillStyle=gH; svCtx.fillRect(0,0,w,h);
  // transparent → black (top→bottom)
  const gV = svCtx.createLinearGradient(0,0,0,h);
  gV.addColorStop(0,'rgba(0,0,0,0)');
  gV.addColorStop(1,'#000');
  svCtx.fillStyle=gV; svCtx.fillRect(0,0,w,h);
}

function drawAlpha(){
  const [r,g,b]=hsvToRgb(hsv.h,hsv.s,hsv.v);
  const w=alphaCanvas.width, h=alphaCanvas.height;
  const g2=alphaCtx.createLinearGradient(0,0,w,0);
  g2.addColorStop(0,`rgba(${r},${g},${b},0)`);
  g2.addColorStop(1,`rgba(${r},${g},${b},1)`);
  alphaCtx.clearRect(0,0,w,h);
  alphaCtx.fillStyle=g2; alphaCtx.fillRect(0,0,w,h);
}

function updateCursors(){
  const sw=svCanvas.offsetWidth||260, sh=svCanvas.offsetHeight||160;
  svCursor.style.left = (hsv.s/100*sw)+'px';
  svCursor.style.top  = ((1-hsv.v/100)*sh)+'px';
  hueThumb.style.left = (hsv.h/360*100)+'%';
  alphaThumb.style.left = (alpha/100*100)+'%';
}

function updateUI(){
  const [r,g,b]=hsvToRgb(hsv.h,hsv.s,hsv.v);
  const hex=rgbToHex(r,g,b);
  const a=alpha/100;
  hexInput.value=hex;
  alphaInput.value=alpha;
  const col=`rgba(${r},${g},${b},${a})`;
  colorPreview.style.background=hex;
  resultSwatchColor.style.background=col;
  drawSV(); drawAlpha(); updateCursors();
}

/* drag SV */
function svPick(e){
  const rect=svCanvas.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  hsv.s=Math.max(0,Math.min(100,cx/rect.width*100));
  hsv.v=Math.max(0,Math.min(100,(1-cy/rect.height)*100));
  updateUI();
}
const svWrap=document.getElementById('svWrap');
let draggingSV=false;
svWrap.addEventListener('mousedown',e=>{draggingSV=true;svPick(e);});
svWrap.addEventListener('touchstart',e=>{draggingSV=true;svPick(e);},{passive:true});
window.addEventListener('mousemove',e=>{if(draggingSV)svPick(e);});
window.addEventListener('touchmove',e=>{if(draggingSV)svPick(e);},{passive:true});
window.addEventListener('mouseup',()=>draggingSV=false);
window.addEventListener('touchend',()=>draggingSV=false);

/* drag Hue */
function huePick(e){
  const rect=hueBar.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  hsv.h=Math.max(0,Math.min(360,x/rect.width*360));
  updateUI();
}
const hueWrap=document.getElementById('hueWrap');
let draggingH=false;
hueWrap.addEventListener('mousedown',e=>{draggingH=true;huePick(e);});
hueWrap.addEventListener('touchstart',e=>{draggingH=true;huePick(e);},{passive:true});
window.addEventListener('mousemove',e=>{if(draggingH)huePick(e);});
window.addEventListener('touchmove',e=>{if(draggingH)huePick(e);},{passive:true});
window.addEventListener('mouseup',()=>draggingH=false);
window.addEventListener('touchend',()=>draggingH=false);

/* drag Alpha */
function alphaPick(e){
  const rect=alphaCanvas.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  alpha=Math.max(0,Math.min(100,Math.round(x/rect.width*100)));
  updateUI();
}
const alphaWrap=document.getElementById('alphaWrap');
let draggingA=false;
alphaWrap.addEventListener('mousedown',e=>{draggingA=true;alphaPick(e);});
alphaWrap.addEventListener('touchstart',e=>{draggingA=true;alphaPick(e);},{passive:true});
window.addEventListener('mousemove',e=>{if(draggingA)alphaPick(e);});
window.addEventListener('touchmove',e=>{if(draggingA)alphaPick(e);},{passive:true});
window.addEventListener('mouseup',()=>draggingA=false);
window.addEventListener('touchend',()=>draggingA=false);

/* hex input */
hexInput.addEventListener('input',()=>{
  const v=hexInput.value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    const [r,g,b]=hexToRgb(v);
    hsv=rgbToHsv(r,g,b);
    updateUI();
  }
});

/* alpha input */
alphaInput.addEventListener('input',()=>{
  alpha=Math.max(0,Math.min(100,parseInt(alphaInput.value)||0));
  updateUI();
});

/* Preset row */
const presetRow=document.getElementById('presetRow');
PRESETS.forEach(c=>{
  const sw=document.createElement('div');
  sw.className='preset-swatch'; sw.style.background=c; sw.title=c;
  sw.onclick=()=>{
    const [r,g,b]=hexToRgb(c.length===4
      ? '#'+[...c.slice(1)].map(x=>x+x).join('') : c);
    hsv=rgbToHsv(r,g,b); alpha=100; updateUI();
  };
  presetRow.appendChild(sw);
});

/* Size chips */
[8,10,12,14,16,18,20,24,28,32,36,48].forEach(s=>{
  const ch=document.createElement('button');
  ch.className='size-chip'; ch.textContent=s;
  ch.onclick=()=>{

/* init */
updateUI();

function toggleColor(){
  const p=document.getElementById('colorPopup');
  const open=p.classList.toggle('open');
  document.getElementById('sizePopup').classList.remove('open');
  if(open) setTimeout(updateUI,10);
}
function toggleSize(){
  const p=document.getElementById('sizePopup');
  p.classList.toggle('open');
  document.getElementById('colorPopup').classList.remove('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#colorAnchor')) document.getElementById('colorPopup').classList.remove('open');
  if(!e.target.closest('#sizeAnchor'))  document.getElementById('sizePopup').classList.remove('open');
});

/* ═══════════════════════════════════════════════
   EDITOR HELPERS
═══════════════════════════════════════════════ */
const editor=document.getElementById('editor');

function getSel(){
  return {s:editor.selectionStart, e:editor.selectionEnd,
          sel:editor.value.substring(editor.selectionStart,editor.selectionEnd)};
}

function insertWrap(before,after,placeholder){
  const {s,e,sel}=getSel();
  const use=sel||placeholder;
  const v=editor.value;
  editor.value=v.slice(0,s)+before+use+after+v.slice(e);
  const cs=s+before.length, ce=cs+use.length;
  editor.setSelectionRange(cs,ce);
  editor.focus(); updatePreview();
}

function wrapTag(tag){
  const ph={b:'văn bản đậm',i:'văn bản nghiêng'}[tag]||'text';
  insertWrap(`<${tag}>`,`</${tag}>`,ph);
}

function applyColor(){
  const [r,g,b]=hsvToRgb(hsv.h,hsv.s,hsv.v);
  const hex=rgbToHex(r,g,b);
  const a=alpha/100;
  const colAttr = a<1 ? hex+Math.round(a*255).toString(16).padStart(2,'0') : hex;
  insertWrap(`<color="${colAttr}">`,`</color>`,'văn bản màu');
  document.getElementById('colorPopup').classList.remove('open');
}

function applySize(){
  const sz=parseInt(document.getElementById('sizeInput').value)||16;
  insertWrap(`<size="${sz}">`,`</size>`,'văn bản');
  document.getElementById('sizePopup').classList.remove('open');
}

function insertNewline(){
  const {s}=getSel();
  editor.value=editor.value.slice(0,s)+'\n'+editor.value.slice(s);
  editor.setSelectionRange(s+1,s+1);
  editor.focus(); updatePreview();
}

function clearText(){ editor.value=''; updatePreview(); editor.focus(); }

function copyText(){
  navigator.clipboard.writeText(editor.value).then(()=>{
    const ok=document.getElementById('copyOk');
    ok.classList.add('show');
    setTimeout(()=>ok.classList.remove('show'),2000);
  });
}

editor.addEventListener('input',updatePreview);

/* ═══════════════════════════════════════════════
   PREVIEW
═══════════════════════════════════════════════ */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderTags(text){
  // Parse token by token so tags don't interfere with each other
  const rules = [
    { re: /<color="(#[0-9a-fA-F]{3,8})">([\s\S]*?)<\/color>/g,
      fn: (_,c,t) => `<span style="color:${c}">${renderTags(t)}</span>` },
    { re: /<size="(\d+(?:\.\d+)?)">([\s\S]*?)<\/size>/g,
      fn: (_,s,t) => `<span style="font-size:${s}px">${renderTags(t)}</span>` },
    { re: /<b>([\s\S]*?)<\/b>/g,
      fn: (_,t) => `<b>${renderTags(t)}</b>` },
    { re: /<i>([\s\S]*?)<\/i>/g,
      fn: (_,t) => `<i>${renderTags(t)}</i>` },
  ];

  // Split text into known-tag chunks vs plain text
  const tagRe = /<(?:color="[^"]*"|size="[^"]*"|b|i|\/color|\/size|\/b|\/i)>/g;
  let result = '', last = 0, m;
  // Collect all tag positions
  const allTags = [];
  for(const rule of rules){
    rule.re.lastIndex=0;
    while((m=rule.re.exec(text))!==null) allTags.push({start:m.index,end:m.index+m[0].length,m,fn:rule.fn});
  }
  // Sort by position, remove overlaps
  allTags.sort((a,b)=>a.start-b.start);
  let cursor=0;
  for(const tok of allTags){
    if(tok.start<cursor) continue; // skip overlapping
    result += escapeHtml(text.slice(cursor,tok.start));
    result += tok.fn(...tok.m);
    cursor = tok.end;
  }
  result += escapeHtml(text.slice(cursor));
  return result;
}

function updatePreview(){
  const raw = editor.value;
  document.getElementById('charCount').textContent = raw.length + ' ký tự';
  if(!raw.trim()){
    document.getElementById('preview').innerHTML = '<span class="preview-empty">Văn bản đã định dạng sẽ hiện ở đây…</span>';
    return;
  }
  document.getElementById('preview').innerHTML = renderTags(raw).replace(/\n/g,'<br>');
}
